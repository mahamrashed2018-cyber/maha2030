const EXTRAS=[{id:'x1',name:'التخطيط التعليمي',icon:'▤',description:'الخطط الدراسية وتحضير الدروس والخطط العلاجية والإثرائية.'},{id:'x2',name:'التطوير المهني',icon:'✦',description:'الدورات والورش والمجتمعات المهنية والتعلم الذاتي.'},{id:'x3',name:'المبادرات والمشروعات',icon:'◈',description:'المشروعات الرقمية والتحديات والأنشطة الإبداعية.'},{id:'x4',name:'الذكاء الاصطناعي في التعليم',icon:'⌘',description:'نماذج توظيف أدوات الذكاء الاصطناعي في التعليم بصورة مسؤولة.'},{id:'x5',name:'التحصيل الدراسي وقياس الأثر',icon:'↗',description:'المؤشرات والتحليل والتقارير وخطط التحسين.'},{id:'x6',name:'الإنجازات والتكريم',icon:'☆',description:'الشهادات وخطابات الشكر والإنجازات المهنية.'},{id:'x7',name:'الممارسات التعليمية المتميزة',icon:'✺',description:'تجارب واستراتيجيات تعليمية مبتكرة.'},{id:'x8',name:'التأمل المهني والتطوير',icon:'◉',description:'التأملات المهنية والفرص التطويرية وخطوات التحسين.'}];
const ALL=[...CATEGORIES,...EXTRAS];const BASE={profile:{name:'مها بنت محمد الراشد',job:'معلمة المهارات الرقمية',school:'الابتدائية الأولى بنعام',office:'الإدارة العامة للتعليم بمنطقة الرياض',year:'',qualification:'',specialty:'',experience:'',skills:'',training:'',email:''},vision:'التميز في تعليم المهارات الرقمية، وإعداد متعلمات مبدعات وواعيات رقميًا، قادرات على توظيف التقنية بفاعلية وأمان في التعلم والحياة.',mission:'تقديم خبرات تعليمية رقمية تفاعلية ومحفزة، تعتمد على الابتكار والتعلم النشط والتقويم المستمر، لتنمية مهارات التفكير وحل المشكلات وتعزيز الكفايات الرقمية لدى المتعلمات.',goals:['تنمية المهارات الرقمية والتفكير الحاسوبي.','توظيف التقنيات الحديثة والذكاء الاصطناعي بصورة مسؤولة.','تحسين نواتج التعلم بالتخطيط والتقويم الفعال.','مراعاة الفروق الفردية وتنويع الاستراتيجيات.','تعزيز المواطنة الرقمية والاستخدام الآمن للتقنية.'],evidence:[],notes:{},folders:{}};
const STORE='maha_portfolio_v1';let state=load(),current='home',query='',editId=null;
function load(){try{let v=JSON.parse(localStorage.getItem(STORE));if(v&&v.profile&&Array.isArray(v.evidence))return {...structuredClone(BASE),...v,profile:{...BASE.profile,...v.profile},notes:v.notes||{}}}catch(e){}return structuredClone(BASE)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));return true}catch(e){toast('تعذر الحفظ في المتصفح. يرجى تصدير نسخة احتياطية.');return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cat(id){return ALL.find(x=>x.id===id)}function count(id){return state.evidence.filter(e=>e.category===id).length}function filled(){return CATEGORIES.filter(c=>count(c.id)>0).length}function pct(){return Math.round(filled()/11*100)}function isValidUrl(v){try{let u=new URL(v);return ['https:','http:'].includes(u.protocol)}catch(e){return false}}
function navitem(id,label,icon){return `<button class="nav-btn ${current===id?'active':''}" onclick="navigate('${id}')"><span class="sym">${icon}</span><span>${esc(label)}</span></button>`}
function renderNav(){document.getElementById('nav').innerHTML='<div class="nav-title">الملف المهني</div>'+navitem('home','الرئيسية','⌂')+navitem('vision','الرؤية والرسالة','◉')+navitem('cv','السيرة الذاتية','▣')+navitem('evaluation','عناصر تقييم الأداء','▦')+'<div class="nav-title">عناصر التقييم الـ 11</div>'+CATEGORIES.map(c=>navitem(c.id,c.name,c.icon)).join('')+'<div class="nav-title">التوثيق والإنجازات</div>'+EXTRAS.map(c=>navitem(c.id,c.name,c.icon)).join('')+'<div class="nav-title">الإدارة</div>'+navitem('all','جميع الشواهد','⌕')+navitem('settings','الإعدادات والنسخ الاحتياطي','⚙');document.getElementById('side-year').textContent='العام الدراسي: '+(state.profile.year||'قابل للتعديل')}
function navigate(id){current=id;query='';render();closeSidebar();window.scrollTo({top:0,behavior:'smooth'})}function render(){renderNav();let t={home:'الرئيسية',vision:'الرؤية والرسالة',cv:'السيرة الذاتية',evaluation:'عناصر التقييم',all:'جميع الشواهد',settings:'الإعدادات'}[current]||cat(current)?.name||'الرئيسية';document.getElementById('crumb').textContent=t;let root=document.getElementById('content');root.innerHTML=current==='home'?home():current==='vision'?vision():current==='cv'?cv():current==='evaluation'?evaluation():current==='all'?allEvidence():current==='settings'?settings():cat(current)?detail(cat(current)):home()}
function intro(k,title,sub){return `<div class="page-intro"><div class="kicker">${esc(k)}</div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>`}
function stat(label,num,ic){return `<div class="stat"><div><span class="number">${num}</span><span class="label">${label}</span></div><span class="iconbox">${ic}</span></div>`}
function catCard(c){return `<div class="card category-card"><div class="cat-top"><span class="cat-icon">${c.icon}</span><span class="catnum">${c.id.startsWith('c')?'عنصر '+c.id.slice(1):'قسم مهني'}</span></div><h3>${esc(c.name)}</h3><p>${esc(c.description)}</p><div class="cat-foot"><span>${count(c.id)} ${count(c.id)===1?'شاهد':'شواهد'} مضافة</span><button class="btn ghost small" onclick="navigate('${c.id}')">استعراض ←</button></div></div>`}
function home(){return `<section class="hero"><div class="eyebrow">وزارة التعليم · ${esc(state.profile.office)}</div><h1>ملف الإنجاز المهني<br><span style="font-weight:500;font-size:.72em">لمعلمة المهارات الرقمية</span></h1><p>مسيرة مهنية نحو تعليم رقمي إبداعي، توثق الممارسات التعليمية وتبرز الإنجازات وأثر التعلم.</p><div class="hero-bottom"><button class="btn" onclick="navigate('evaluation')">استعراض عناصر التقييم ←</button><span class="hero-chip">${esc(state.profile.name)}</span><span class="hero-chip">${esc(state.profile.school)}</span>${state.profile.year?`<span class="hero-chip">${esc(state.profile.year)}</span>`:''}</div></section><div class="grid stats">${stat('عناصر التقييم','11','▦')}${stat('العناصر الموثقة',filled()+' / 11','✓')}${stat('الشواهد المضافة',state.evidence.length,'▣')}${stat('اكتمال التوثيق',pct()+'%','◉')}</div><div class="mini-panel"><div class="card card-pad"><div class="evidence-head"><h3>حالة توثيق عناصر التقييم</h3><span class="tag">${filled()} من 11 عنصرًا</span></div><div class="progress"><span style="width:${pct()}%"></span></div><p class="muted" style="margin-bottom:0">يعكس المؤشر وجود شاهد واحد على الأقل لكل عنصر، ولا يمثل درجة تقييم الأداء الوظيفي.</p></div><div class="card card-pad"><h3>وصول سريع</h3><div class="quick"><button class="btn outline small" onclick="navigate('cv')">السيرة الذاتية</button><button class="btn outline small" onclick="navigate('vision')">الرؤية والرسالة</button><button class="btn outline small" onclick="navigate('all')">الأدلة والشواهد</button></div></div></div><div class="section-head"><div><h2>عناصر تقييم الأداء الوظيفي</h2><p>11 عنصرًا بحسب الصورة المرفقة، لكل منها صفحة توثيق مستقلة</p></div><button class="btn outline small" onclick="navigate('evaluation')">عرض جميع العناصر ←</button></div><div class="grid cards">${CATEGORIES.map(catCard).join('')}</div><div class="section-head"><div><h2>أقسام الإنجاز المهني</h2><p>أقسام إضافية لتنظيم الممارسات والشهادات والإنجازات</p></div></div><div class="grid cards">${EXTRAS.map(catCard).join('')}</div>`}
function evaluation(){return intro('الأداء الوظيفي','عناصر تقييم الأداء الوظيفي','جميع العناصر الإحدى عشرة الواردة في الصورة المرجعية، مع توثيق مستقل للأدلة والشواهد.')+`<div class="grid stats">${stat('إجمالي العناصر',11,'▦')}${stat('العناصر الموثقة',filled(),'✓')}${stat('العناصر دون شواهد',11-filled(),'○')}${stat('اكتمال التوثيق',pct()+'%','↗')}</div><div class="section-head"><h2>استعراض العناصر</h2><div class="searchwrap"><input class="search" id="catSearch" placeholder="ابحثي عن عنصر تقييم..." oninput="filterCategories(this.value)" aria-label="بحث عناصر التقييم"></div></div><div id="catlist" class="grid cards">${CATEGORIES.map(catCard).join('')}</div>`}
function filterCategories(q){document.getElementById('catlist').innerHTML=CATEGORIES.filter(c=>c.name.includes(q)||c.description.includes(q)).map(catCard).join('')||'<div class="empty">لا توجد عناصر مطابقة للبحث.</div>'}
function vision(){return intro('الهوية المهنية','الرؤية والرسالة والقيم','مرتكزات توجه الممارسة التعليمية والتطوير المهني المستمر.')+`<div class="grid two-cols"><div class="card card-pad"><h3>◉ الرؤية</h3><p class="quote">«${esc(state.vision)}»</p></div><div class="card card-pad"><h3>✦ الرسالة</h3><p class="quote" style="font-size:15px!important">«${esc(state.mission)}»</p></div></div><div class="section-head"><h2>الأهداف المهنية</h2></div><div class="card card-pad"><div class="numbered-list">${state.goals.map((g,i)=>`<div><span class="num-dot">${i+1}</span><span>${esc(g)}</span></div>`).join('')}</div></div><div class="section-head"><h2>القيم المهنية</h2></div><div class="quick">${['الإبداع','المسؤولية','التعاون','الإتقان','التعلم المستمر','المواطنة الرقمية','التميز'].map(x=>`<span class="tag" style="font-size:13px;padding:8px 18px">${x}</span>`).join('')}</div><div class="page-tools"><button class="btn outline" onclick="openProfileModal('vision')">✎ تعديل الرؤية والرسالة</button></div>`}
function cv(){let p=state.profile,items=[['الاسم',p.name],['المسمى الوظيفي',p.job],['الجهة','وزارة التعليم'],['الإدارة التعليمية',p.office],['المدرسة',p.school],['العام الدراسي',p.year],['المؤهل العلمي',p.qualification],['التخصص',p.specialty],['سنوات الخبرة',p.experience],['المهارات المهنية',p.skills],['الدورات التدريبية',p.training],['البريد المهني',p.email]];return intro('التعريف المهني','السيرة الذاتية','البيانات الأساسية والخبرات المهنية. تُترك المعلومات غير المدخلة دون افتراض أو اختلاق.')+`<div class="card card-pad"><div class="evidence-head"><div><h3 style="font-size:19px">${esc(p.name)}</h3><p class="muted">${esc(p.job)} · ${esc(p.school)}</p></div><button class="btn outline small no-print" onclick="openProfileModal('cv')">✎ تعديل البيانات</button></div><div class="cv-grid">${items.map(([k,v])=>`<div class="cv-item"><label>${esc(k)}</label><strong>${v?esc(v):'<span style="font-weight:400;color:#9bacaa">لم يُدخل بعد</span>'}</strong></div>`).join('')}</div></div><div class="page-tools"><button class="btn outline" onclick="window.print()">⎙ طباعة الصفحة / حفظ PDF</button></div>`}
function noteFields(id){let n=state.notes[id]||{};return `<div class="card card-pad"><h3>التوثيق المهني والتأمل</h3><div class="form-grid"><div class="field full"><label>الممارسات المنفذة</label><textarea id="notes-practices" placeholder="اكتبي الممارسات التي نُفذت بالفعل...">${esc(n.practices||'')}</textarea></div><div class="field full"><label>الأثر التعليمي</label><textarea id="notes-impact" placeholder="اكتبي أثر الممارسات أو النتائج الموثقة...">${esc(n.impact||'')}</textarea></div><div class="field"><label>التأمل المهني</label><textarea id="notes-reflection" placeholder="نقاط القوة وفرص التحسين...">${esc(n.reflection||'')}</textarea></div><div class="field"><label>خطوات التطوير</label><textarea id="notes-improve" placeholder="إجراءات التحسين المستقبلية...">${esc(n.improve||'')}</textarea></div></div><div class="page-tools"><button class="btn small" onclick="saveNotes('${id}')">حفظ التوثيق</button><span class="hint">تحفظ هذه النصوص محليًا على الجهاز الحالي.</span></div></div>`}
function detail(c){return intro(c.id.startsWith('c')?'عنصر التقييم رقم '+c.id.slice(1):'قسم الإنجاز المهني',c.name,c.description)+`<div class="page-tools"><button class="btn" onclick="openEvidenceModal('${c.id}')">＋ إضافة شاهد لهذا العنصر</button><button class="btn outline" onclick="navigate('evaluation')">↩ عناصر التقييم</button></div><div class="grid two-cols"><div class="card card-pad"><h3>الممارسات المهنية المقترحة للتوثيق</h3>${c.practices?`<ul class="mini-list">${c.practices.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:'<p>أدرجي في هذا القسم الممارسات المهنية المرتبطة به مدعومة بأدلة وشواهد حقيقية.</p>'}<p class="muted">هذه أمثلة إرشادية وليست إثباتًا لتنفيذ الممارسة.</p></div><div class="card card-pad"><h3>ملخص توثيق العنصر</h3><div class="stat" style="box-shadow:none"><div><span class="number">${count(c.id)}</span><span class="label">شواهد مضافة</span></div><span class="iconbox">▣</span></div><div class="feature-box"><strong>حالة التوثيق</strong>${count(c.id)?'يتضمن هذا العنصر روابط لشواهد مضافة.':'لم تُضف شواهد لهذا العنصر بعد.'}</div></div></div><div class="section-head"><div><h2>الأدلة والشواهد</h2><p>روابط المستندات والمجلدات الداعمة لهذا العنصر</p></div></div>${evidenceList(state.evidence.filter(e=>e.category===c.id))}<div class="section-head"><h2>الأثر والتأمل والتطوير</h2></div>${noteFields(c.id)}`}
function evidenceList(list){if(!list.length)return `<div class="empty"><div class="empty-icon">▤</div><b>لا توجد شواهد مضافة حتى الآن</b><p>أضيفي رابط الملف أو المجلد من Google Drive، وسيتاح فتحه مباشرة للمراجعة وفق صلاحيات مشاركته.</p><button class="btn small" onclick="openEvidenceModal('${cat(current)?current:''}')">＋ إضافة أول شاهد</button></div>`;return `<div>${list.map(e=>`<div class="evidence"><div style="min-width:0;flex:1"><div class="evtitle">▣ ${esc(e.title)}</div><div class="evmeta">${esc(cat(e.category)?.name||'قسم غير معروف')} ${e.date?' · '+esc(e.date):''} ${e.tag?' · '+esc(e.tag):''}</div>${e.desc?`<div class="evdesc">${esc(e.desc)}</div>`:''}</div><div class="evactions"><a class="btn small" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">↗ فتح الشاهد</a><button class="btn outline small" onclick="openEvidenceModal(null,'${esc(e.id)}')">تعديل</button><button class="btn danger small" onclick="deleteEvidence('${esc(e.id)}')">حذف</button></div></div>`).join('')}</div>`}
function allEvidence(){let list=state.evidence.filter(e=>(!query||[e.title,e.desc,e.tag,cat(e.category)?.name].some(v=>String(v||'').includes(query))));return intro('أرشيف الشواهد','جميع الأدلة والشواهد','استعراض مركزي للروابط المضافة إلى عناصر التقييم والأقسام المهنية.')+`<div class="page-tools"><input class="search" style="max-width:380px" placeholder="ابحثي باسم الشاهد أو العنصر..." value="${esc(query)}" oninput="query=this.value;document.getElementById('evidenceArea').innerHTML=evidenceList(state.evidence.filter(e=>[e.title,e.desc,e.tag,cat(e.category)?.name].some(v=>String(v||'').includes(query))))"><button class="btn" onclick="openEvidenceModal()">＋ إضافة شاهد</button></div><div id="evidenceArea">${evidenceList(list)}</div>`}
function settings(){return intro('إدارة الملف','الإعدادات والنسخ الاحتياطي','إدارة بيانات المعلمة والنسخ الاحتياطية وروابط الأدلة. لا تتطلب تشغيل خادم.')+`<div class="grid two-cols"><div class="card card-pad"><h3>البيانات المهنية</h3><p>تعديل اسم المعلمة، المدرسة، العام الدراسي والبيانات المرتبطة بالسيرة الذاتية.</p><button class="btn outline" onclick="openProfileModal('cv')">✎ تعديل البيانات</button></div><div class="card card-pad"><h3>النسخة الاحتياطية</h3><p>احفظي نسخة من البيانات والشواهد بصيغة JSON، أو استوردي نسخة سابقة على جهاز آخر.</p><div class="quick"><button class="btn" onclick="exportData()">↓ تصدير البيانات</button><button class="btn outline" onclick="document.getElementById('importFile').click()">↑ استيراد البيانات</button></div></div></div><div class="note"><b>تنبيه مهم:</b> روابط الشواهد والملاحظات محفوظة في تخزين المتصفح على هذا الجهاز فقط. لا توجد مزامنة تلقائية مع Google Drive أو الأجهزة الأخرى. استخدام التصفح الخاص أو حذف بيانات المتصفح قد يؤدي لفقدانها. احفظي نسخًا احتياطية بانتظام.</div><div class="card card-pad"><h3>كيفية ربط شاهد من Google Drive</h3><div class="numbered-list"><div><span class="num-dot">1</span>افتحي الملف أو المجلد المطلوب في Google Drive.</div><div><span class="num-dot">2</span>انسخي رابط المشاركة، وتحققي من أن المقيّمة لديها الإذن المناسب لعرضه.</div><div><span class="num-dot">3</span>اضغطي «إضافة شاهد»، وحددي العنصر، والصقي الرابط، واكتبي اسمًا واضحًا للشاهد.</div><div><span class="num-dot">4</span>احفظي الشاهد واختبري فتحه من حساب المقيّمة عند الإمكان.</div></div></div><div class="page-tools"><button class="btn danger" onclick="resetData()">إعادة ضبط البيانات المحلية</button></div>`}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalLayer').classList.add('show');document.body.style.overflow='hidden'}function closeModal(){document.getElementById('modalLayer').classList.remove('show');document.body.style.overflow=''}
function openEvidenceModal(category,editing){let e=editing?state.evidence.find(x=>x.id===editing):null;editId=e?.id||null;let selected=e?.category||category||'c1';openModal(e?'تعديل الشاهد':'إضافة شاهد جديد',`<form id="evForm" onsubmit="submitEvidence(event)"><div class="form-grid"><div class="field full"><label for="evtitle">عنوان الشاهد *</label><input required id="evtitle" maxlength="180" value="${esc(e?.title||'')}" placeholder="مثال: تقرير تطبيق استراتيجية التعلم باللعب"></div><div class="field"><label for="evcat">عنصر التقييم / القسم *</label><select required id="evcat">${ALL.map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label for="evdate">تاريخ الشاهد</label><input id="evdate" type="date" value="${esc(e?.date||'')}"></div><div class="field full"><label for="evurl">رابط Google Drive أو رابط الشاهد *</label><input type="url" required id="evurl" dir="ltr" style="text-align:left" value="${esc(e?.url||'')}" placeholder="https://drive.google.com/..."></div><div class="field full"><label for="evdesc">وصف مختصر</label><textarea id="evdesc" placeholder="ما الذي يوثقه هذا الشاهد؟">${esc(e?.desc||'')}</textarea></div><div class="field full"><label for="evtag">وسم أو تصنيف (اختياري)</label><input id="evtag" maxlength="90" value="${esc(e?.tag||'')}" placeholder="مثال: تغذية راجعة / ورشة / تقرير"></div></div><p class="hint">إضافة الرابط لا تغيّر صلاحيات Google Drive. تأكدي من توفر حق العرض للمقيّمة.</p><div class="modal-footer"><button type="submit" class="btn">حفظ الشاهد</button><button type="button" class="btn outline" onclick="closeModal()">إلغاء</button></div></form>`)}
function submitEvidence(ev){ev.preventDefault();let title=document.getElementById('evtitle').value.trim(),url=document.getElementById('evurl').value.trim(),category=document.getElementById('evcat').value;if(!title||!isValidUrl(url)||!cat(category)){toast('تحققي من عنوان الشاهد والرابط والعنصر.');return}let obj={id:editId||('ev_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)),title,url,category,date:document.getElementById('evdate').value,desc:document.getElementById('evdesc').value.trim(),tag:document.getElementById('evtag').value.trim()};let idx=state.evidence.findIndex(x=>x.id===editId);if(idx>=0)state.evidence[idx]=obj;else state.evidence.unshift(obj);save();closeModal();render();toast('تم حفظ الشاهد بنجاح')}
function deleteEvidence(id){if(!confirm('هل تريدين حذف رابط هذا الشاهد من ملف الإنجاز؟ (لن يُحذف الملف من Google Drive)'))return;state.evidence=state.evidence.filter(e=>e.id!==id);save();render();toast('تم حذف الرابط من الملف')}
function saveNotes(id){state.notes[id]={practices:document.getElementById('notes-practices').value,impact:document.getElementById('notes-impact').value,reflection:document.getElementById('notes-reflection').value,improve:document.getElementById('notes-improve').value};save();toast('تم حفظ التوثيق المهني')}
function openProfileModal(kind){if(kind==='vision'){openModal('تعديل الرؤية والرسالة',`<form onsubmit="saveVision(event)"><div class="field"><label>الرؤية</label><textarea id="vvision" style="min-height:105px">${esc(state.vision)}</textarea></div><div class="field" style="margin-top:13px"><label>الرسالة</label><textarea id="vmission" style="min-height:105px">${esc(state.mission)}</textarea></div><div class="modal-footer"><button class="btn" type="submit">حفظ التعديلات</button><button class="btn outline" type="button" onclick="closeModal()">إلغاء</button></div></form>`);return}let fields=[['name','الاسم'],['job','المسمى الوظيفي'],['school','المدرسة'],['office','الإدارة التعليمية'],['year','العام الدراسي'],['qualification','المؤهل العلمي'],['specialty','التخصص'],['experience','سنوات الخبرة'],['skills','المهارات المهنية'],['training','الدورات التدريبية'],['email','البريد المهني']];openModal('تعديل البيانات المهنية',`<form onsubmit="saveProfile(event)"><div class="form-grid">${fields.map(([k,label])=>`<div class="field ${['skills','training'].includes(k)?'full':''}"><label for="p_${k}">${label}</label>${['skills','training'].includes(k)?`<textarea id="p_${k}">${esc(state.profile[k])}</textarea>`:`<input id="p_${k}" value="${esc(state.profile[k])}">`}</div>`).join('')}</div><div class="modal-footer"><button class="btn" type="submit">حفظ البيانات</button><button class="btn outline" type="button" onclick="closeModal()">إلغاء</button></div></form>`)}
function saveVision(ev){ev.preventDefault();state.vision=document.getElementById('vvision').value.trim();state.mission=document.getElementById('vmission').value.trim();save();closeModal();render();toast('تم حفظ الرؤية والرسالة')}
function saveProfile(ev){ev.preventDefault();Object.keys(BASE.profile).forEach(k=>{let inp=document.getElementById('p_'+k);if(inp)state.profile[k]=inp.value.trim()});save();closeModal();render();toast('تم حفظ البيانات المهنية')}
function exportData(){let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json;charset=utf-8'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='نسخة_احتياطية_ملف_الإنجاز.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('تم إنشاء ملف النسخة الاحتياطية')}
async function importData(ev){let file=ev.target.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!data||!data.profile||!Array.isArray(data.evidence))throw Error('format');if(!confirm('استيراد النسخة سيستبدل بيانات الملف الحالية. هل تريدين المتابعة؟'))return;let safeEvidence=data.evidence.filter(e=>e&&typeof e.title==='string'&&typeof e.url==='string'&&isValidUrl(e.url)&&cat(e.category)).map(e=>({id:String(e.id||'ev_'+Math.random()),title:e.title,url:e.url,category:e.category,date:String(e.date||''),desc:String(e.desc||''),tag:String(e.tag||'')}));state={profile:{...BASE.profile,...Object.fromEntries(Object.keys(BASE.profile).map(k=>[k,String(data.profile[k]||'')]))},vision:typeof data.vision==='string'?data.vision:BASE.vision,mission:typeof data.mission==='string'?data.mission:BASE.mission,goals:Array.isArray(data.goals)?data.goals.filter(g=>typeof g==='string'):BASE.goals,evidence:safeEvidence,notes:(data.notes&&typeof data.notes==='object'&&!Array.isArray(data.notes))?data.notes:{},folders:(data.folders&&typeof data.folders==='object'&&!Array.isArray(data.folders))?Object.fromEntries(Object.entries(data.folders).filter(([k,v])=>cat(k)&&typeof v==='string'&&isValidUrl(v))):{}};save();navigate('home');toast('تم استيراد النسخة الاحتياطية بنجاح')}catch(e){toast('ملف النسخة الاحتياطية غير صالح')}finally{ev.target.value=''}}
function resetData(){if(confirm('هل تريدين إزالة جميع الشواهد والتعديلات المحلية؟ هذا الإجراء لا يمكن التراجع عنه دون نسخة احتياطية.')){state=structuredClone(BASE);save();navigate('home');toast('أُعيد ضبط البيانات المحلية')}}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
let toastTimer;function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',3400)}document.getElementById('modalLayer').addEventListener('click',e=>{if(e.target.id==='modalLayer')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
/* تطويرات الإصدار الثاني: حفظ وإدارة مجلدات الأدلة + وضع العرض + تقرير التجميع */
let evaluatorMode=false;
let filterMissing=false;
function modeButton(){return `<button class="btn outline small no-print" onclick="toggleEvaluator()">${evaluatorMode?'🔓 العودة لوضع التحرير':'◉ وضع عرض المقيّمة'}</button>`}
function toggleEvaluator(){evaluatorMode=!evaluatorMode;document.body.classList.toggle('evaluator',evaluatorMode);if(evaluatorMode&&current==='settings')current='evaluation';render();toast(evaluatorMode?'وضع العرض مفعل: أدوات التحرير مخفية للعرض فقط، وليس حماية بكلمة مرور.':'تمت العودة لوضع التحرير')}
function folderUrl(id){return state.folders?.[id]||''}
function editFolder(id){if(evaluatorMode)return;let c=cat(id);if(!c)return;let next=prompt('أدخلي رابط مجلد Google Drive الخاص بـ «'+c.name+'»\nاتركي الحقل فارغًا لمسح الرابط:',folderUrl(id));if(next===null)return;next=next.trim();if(next&&!isValidUrl(next)){toast('يرجى إدراج رابط يبدأ بـ https://');return}if(!state.folders)state.folders={};if(next)state.folders[id]=next;else delete state.folders[id];save();render();toast(next?'تم حفظ رابط المجلد':'تم حذف رابط المجلد')}
function folderSection(c){let link=folderUrl(c.id);return `<div class="folder-strip"><div><strong>▤ مجلد الشواهد على Google Drive</strong><p>${link?'رابط المجلد متاح — تأكدي من منح المقيّمة صلاحية العرض.':'لم يُربط مجلد لهذا العنصر بعد. يمكن إضافة شواهد فردية أيضًا.'}</p></div><div class="quick">${link?`<a class="btn outline" href="${esc(link)}" target="_blank" rel="noopener noreferrer">↗ فتح مجلد الشواهد</a>`:''}<button class="btn outline edit-control" onclick="editFolder('${c.id}')">${link?'✎ تعديل رابط المجلد':'＋ ربط مجلد Drive'}</button></div></div>`}
function qualitySection(c){let v=(state.notes[c.id]||{}).quality||{};let checks=[['dated','تواريخ الأدلة واضحة'],['relevance','الأدلة مرتبطة بالعنصر'],['privacy','خصوصية الطالبات محفوظة']];return `<div class="card card-pad" style="margin:20px 0"><div class="evidence-head"><h3>قائمة مراجعة الشواهد</h3><span class="tag">مراجعة ذاتية، لا تمثل تقييمًا رسميًا</span></div><div class="quality-grid">${checks.map(([id,t])=>`<label><input type="checkbox" ${v[id]?'checked':''} onchange="setQuality('${c.id}','${id}',this.checked)" ${evaluatorMode?'disabled':''}>${t}</label>`).join('')}</div></div>`}
function setQuality(id,key,checked){if(evaluatorMode)return;state.notes[id]??={};state.notes[id].quality??={};state.notes[id].quality[key]=checked;save();toast('حُفظت المراجعة الذاتية')}
function enhancedHome(){let missing=CATEGORIES.filter(c=>!count(c.id)&&!folderUrl(c.id));return `<div class="mode-banner"><span><strong>✦ الإصدار المطوّر</strong> · متابعة التوثيق، روابط المجلدات، وتقرير جاهز للطباعة.</span><button onclick="navigate('report')">عرض تقرير التوثيق ←</button></div>${home()}<div class="card card-pad" style="margin-top:22px"><div class="evidence-head"><h3>العناصر التي تحتاج إلى توثيق</h3><span class="tag">${missing.length} عناصر دون شاهد أو مجلد</span></div>${missing.length?`<div class="grid cards">${missing.slice(0,6).map(c=>`<button class="card" style="text-align:right;padding:12px;border:1px solid #e1ebe8" onclick="navigate('${c.id}')"><strong>${esc(c.name)}</strong><p class="muted" style="margin:4px 0 0">إضافة شاهد أو رابط مجلد ←</p></button>`).join('')}</div>`:'<p>جميع العناصر مرتبطة على الأقل بشاهد أو مجلد. راجعي دقة الأدلة وصلاحيات عرضها.</p>'}</div>`}
function enhancedDetail(c){return detail(c).replace('<div class="page-tools">',folderSection(c)+'<div class="page-tools">')+qualitySection(c)}
function enhancedEvaluation(){return `<div class="page-tools"><button class="btn outline" onclick="navigate('report')">▤ تقرير حالة التوثيق</button><button class="btn outline edit-control" onclick="navigate('settings')">⚙ إدارة الملف</button></div>`+evaluation()}
function safeLink(href,label){return isValidUrl(href)?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:'—'}
function report(){let total=state.evidence.length,linked=CATEGORIES.filter(c=>count(c.id)||folderUrl(c.id)).length;return intro('تقرير شامل','ملخص توثيق ملف الإنجاز','عرض العناصر والشواهد المرتبطة بها بصورة منظمة للطباعة أو الحفظ بصيغة PDF.')+`<div class="report-actions page-tools no-print"><button class="btn" onclick="window.print()">⎙ طباعة التقرير / حفظ PDF</button><button class="btn outline" onclick="navigate('evaluation')">العودة لعناصر التقييم</button></div><div class="card card-pad"><div class="report-header"><h3>ملف الإنجاز المهني | ${esc(state.profile.name)}</h3><p>${esc(state.profile.job)} · ${esc(state.profile.school)} · ${esc(state.profile.year||'العام الدراسي غير محدد')}</p></div><div class="report-kpi"><span>عناصر التقييم: <strong>11</strong></span><span>العناصر المرتبطة بشواهد أو مجلدات: <strong>${linked}</strong></span><span>الشواهد الفردية: <strong>${total}</strong></span><span>نسبة التغطية: <strong>${Math.round(linked/11*100)}%</strong></span></div><table class="report-table"><thead><tr><th style="width:40px">م</th><th>عنصر التقييم</th><th>الشواهد الفردية</th><th>المجلد</th><th>الحالة</th></tr></thead><tbody>${CATEGORIES.map((c,i)=>`<tr><td>${i+1}</td><td><strong>${esc(c.name)}</strong></td><td>${count(c.id)?state.evidence.filter(e=>e.category===c.id).map(e=>safeLink(e.url,e.title)).join('<hr style="border:0;border-top:1px solid #eee">'):'—'}</td><td>${folderUrl(c.id)?safeLink(folderUrl(c.id),'فتح المجلد'):'—'}</td><td>${count(c.id)||folderUrl(c.id)?'مرتبط بأدلة':'بحاجة لتوثيق'}</td></tr>`).join('')}</tbody></table><p class="muted">ملاحظة: تعرض هذه الصفحة وجود الروابط وعددها فقط؛ ولا تتحقق من محتواها أو صلاحية الوصول إليها، ولا تمثل درجة تقييم الأداء.</p></div>`}
const oldRenderNav=renderNav;
renderNav=function(){oldRenderNav();let nav=document.getElementById('nav');let item=navitem('report','تقرير التوثيق','▤');let anchor=nav.querySelector('.nav-title:last-of-type');if(anchor)anchor.insertAdjacentHTML('beforebegin',item);else nav.insertAdjacentHTML('beforeend',item);nav.querySelectorAll('.nav-btn').forEach(b=>{let t=b.textContent.trim();if(t.includes('الإعدادات والنسخ'))b.dataset.private='1'});};
render=function(){renderNav();let t={home:'الرئيسية',vision:'الرؤية والرسالة',cv:'السيرة الذاتية',evaluation:'عناصر التقييم',all:'جميع الشواهد',settings:'الإعدادات',report:'تقرير التوثيق'}[current]||cat(current)?.name||'الرئيسية';document.getElementById('crumb').textContent=t;let root=document.getElementById('content');root.innerHTML=current==='home'?enhancedHome():current==='vision'?vision():current==='cv'?cv():current==='evaluation'?enhancedEvaluation():current==='all'?allEvidence():current==='settings'?settings():current==='report'?report():cat(current)?enhancedDetail(cat(current)):enhancedHome();document.querySelectorAll('.top-actions').forEach(el=>{let prev=el.querySelector('.mode-toggle');if(prev)prev.remove();el.insertAdjacentHTML('afterbegin',`<span class="mode-toggle">${modeButton()}</span>`)});document.body.classList.toggle('evaluator',evaluatorMode);if(evaluatorMode){root.querySelectorAll('button').forEach(b=>{let text=b.textContent||'',fn=b.getAttribute('onclick')||'';if(/إضافة شاهد|تعديل|حذف|حفظ|إدارة|استيراد|تصدير|ربط مجلد/.test(text)||/openEvidenceModal|openProfileModal|saveNotes|deleteEvidence|editFolder|resetData/.test(fn))b.classList.add('edit-control')});root.querySelectorAll('textarea,input:not([type="search"]),select').forEach(b=>b.disabled=true)}};
const oldOpenEvidenceModal=openEvidenceModal;
openEvidenceModal=function(...args){if(evaluatorMode){toast('عرض المقيّمة لا يسمح بتعديل البيانات');return}return oldOpenEvidenceModal(...args)};
const oldSettings=settings;
settings=function(){return oldSettings()+`<div class="card card-pad" style="margin-top:18px"><h3>ترقية تنظيم الشواهد</h3><p>يمكن الآن ربط مجلد Drive مستقل لكل عنصر من صفحة العنصر، وإظهار جميع الروابط في تقرير موحد. حفظ البيانات يتم محليًا ويمكن تصديرها للاستعادة على جهاز آخر.</p><button class="btn outline" onclick="navigate('report')">▤ استعراض التقرير</button></div>`};

render();
</script></body></html>
